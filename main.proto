syntax = "proto3";
import "input.proto";

package PB;

enum Status {
    OK = 0;
    ERROR = 1;
}

message Empty {
}

message Main {
    uint32 id = 1;
    Status status = 2;
    oneof content {
        Empty empty = 3;
        .PB_Input.ButtonEvent button_event = 4;
        .PB_Input.SwitchEvent switch_event = 5;
        .PB_Input.EncoderEvent encoder_event = 6;
    }
}
