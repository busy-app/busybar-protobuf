syntax = "proto3";

package BSB_State;

enum PowerState {
    DISCHARGING = 0;
    CHARGING = 1;
    CHARGED = 2;
}

message Power {
    PowerState power_state = 1;
    uint32 battery_charge_percent = 2;
    uint32 battery_voltage_mv = 3;
    uint32 battery_current_ma = 4;
    uint32 usb_voltage_mv = 5;
}
