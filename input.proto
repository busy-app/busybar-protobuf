syntax = "proto3";

package PB_Input;

enum Button {
    OK = 0;
    BACK = 1;
    START = 2;
}

enum ButtonAction {
    PRESS = 0;
    RELEASE = 1;
}

enum SwitchPosition {
    BUSY = 0;
    STATUS = 1;
    OFF = 2;
    APPS = 3;
    SETTINGS = 4;
}

message ButtonEvent {
    Button button = 1;
    ButtonAction action = 2;
}

message SwitchEvent {
    SwitchPosition position = 1;
}

message EncoderEvent {
    int32 delta = 1;
}

